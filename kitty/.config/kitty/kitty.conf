# kitty 配置 — 官方文档: https://sw.kovidgoyal.net/kitty/conf/
# 修改后 Ctrl+Shift+F5 热重载（或重开 kitty）

# === 字体 ===
# 显式使用 Nerd Font 族名，保证图标字形（Powerline/Devicons 等）能正确显示
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 16

# === 窗口 ===
window_padding_width 10
window_border_width 1
background_opacity 0.7
hide_window_decorations no
confirm_os_window_close 0

# === 光标 ===
cursor_shape beam
cursor_blink_interval 0.5

# === 光标轨迹特效（cursor trail）===
# cursor_trail 大于 0 时启用“拖尾动画”，光标大幅跳转时身后拖一条渐隐轨迹
cursor_trail 3

# 拖尾衰减速度：第一个值最快衰减、第二个值最慢（单位秒）。
# 数值越小拖尾消失越快。调小让拖尾更“轻、短、淡”。
cursor_trail_decay 0.05 0.15

# 触发阈值：光标在某个位置停留超过该毫秒数才会触发拖尾，
# 避免光标快速刷新时（比如 TUI 应用）乱飘。调大一点让拖尾更克制。
cursor_trail_start_threshold 3

# 拖尾颜色：淡粉色（Catppuccin 的粉，柔和一点）
cursor_trail_color #f5c2e7

# === 提示音 ===
enable_audio_bell no
bell_border_width 0

# === 滚动 ===
scrollback_lines 5000

# === 配色：Catppuccin Mocha ===
background            #1e1e2e
foreground            #cdd6f4
cursor                #f5e0e6
cursor_text_color     #1e1e2e
selection_foreground  #1e1e2e
selection_background  #585b70
url_color             #89b4fa

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# === 标签栏（原 dank-tabs 样式 + Catppuccin 配色） ===
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_min_tabs        2
tab_bar_margin_width    0.0
tab_bar_margin_height   2.5 1.5
tab_bar_margin_color    #1e1e2e

tab_bar_background              #1e1e2e
active_tab_foreground           #1e1e2e
active_tab_background           #89b4fa
active_tab_font_style           bold
inactive_tab_foreground         #a6adc8
inactive_tab_background         #1e1e2e
inactive_tab_font_style         normal
tab_activity_symbol             " ● "

tab_title_template              "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
active_tab_title_template       "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
